<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firefox Reader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 350px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            padding: 16px;
        }

        .container {
            background: white;
            border-radius: 8px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 18px;
            margin-bottom: 12px;
            color: #333;
            word-break: break-word;
        }

        .page-info {
            background: #f0f0f0;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 13px;
            color: #666;
            max-height: 60px;
            overflow-y: auto;
        }

        .page-info p {
            margin-bottom: 6px;
        }

        .page-info label {
            font-weight: bold;
            display: block;
            margin-bottom: 2px;
        }

        .button-group {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        button {
            flex: 1;
            padding: 10px 12px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-download {
            background: #4CAF50;
            color: white;
        }

        .btn-download:hover {
            background: #45a049;
        }

        .btn-download:active {
            transform: scale(0.98);
        }

        .btn-send {
            background: #2196F3;
            color: white;
        }

        .btn-send:hover {
            background: #0b7dda;
        }

        .btn-send:active {
            transform: scale(0.98);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status {
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            margin-top: 8px;
            display: none;
            word-wrap: break-word;
        }

        .status.show {
            display: block;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status.loading {
            background: #e2e3e5;
            color: #383d41;
            border: 1px solid #d6d8db;
        }

        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #383d41;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 6px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .error-details {
            font-size: 11px;
            margin-top: 4px;
            padding-top: 6px;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>📄 Firefox Reader</h1>

        <div class="page-info">
            <p>
                <label>Page Title:</label>
                <span id="pageTitle">Loading...</span>
            </p>
            <p>
                <label>URL:</label>
                <span id="pageUrl" style="word-break: break-all; font-size: 11px;"></span>
            </p>
        </div>

        <div class="button-group">
            <button class="btn-download" id="downloadBtn">📥 Download</button>
            <button class="btn-send" id="sendBtn">☁️ Send to DB</button>
        </div>

        <div class="status" id="status"></div>
    </div>

    <script src="popup.js"></script>
</body>

</html>
