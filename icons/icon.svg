  <!-- Document lines -->
  <line x1="40" y1="36" x2="88" y2="36" stroke="#FF9500" stroke-width="3" stroke-linecap="round"/>
  <line x1="40" y1="50" x2="88" y2="50" stroke="#CCCCCC" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="60" x2="88" y2="60" stroke="#CCCCCC" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="70" x2="88" y2="70" stroke="#CCCCCC" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="80" x2="72" y2="80" stroke="#CCCCCC" stroke-width="2" stroke-linecap="round"/>

  <!-- Download arrow -->
